<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Gym">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Mi Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: app móvil oscura de una columna; 4 pestañas abajo; rutina → ficha → modo entreno; botón principal fijo sobre las pestañas */
  --bg:#0B0B0D; --surface:#1A1B1F; --surface2:#24262B; --ink:#F3F3F5; --muted:#9A9CA5; --line:#2E3036;
  --accent:#FFB020; --blue:#5B7CFA; --ok:#3DD68C; --danger:#FF6B5B;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(190px + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;min-height:48px}
.bar h1{font-weight:700;font-size:20px;margin:0;text-align:center;flex:1;text-wrap:balance}
.iconbtn{width:48px;height:48px;border-radius:12px;border:none;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}
.iconbtn svg{width:22px;height:22px}
.spacer{width:48px;flex:0 0 auto}
.big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:6px 0 4px;text-wrap:balance}
.hello{color:var(--muted);font-size:15px}
.sub{color:var(--muted);font-size:14px}
.status{font-size:12px;color:var(--muted)}
.status.ok{color:var(--ok)}
h2{font-weight:700;font-size:20px;margin:26px 0 12px}
.week{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 4px}
.week b{font-family:var(--display);font-size:26px}
.dots{display:flex;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.on{background:var(--accent);border-color:var(--accent)}
.rcard{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rcard b{display:block;font-size:20px}
.rcard .tag{font-size:11px;font-weight:700;color:var(--bg);background:var(--accent);border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle;text-transform:uppercase;letter-spacing:.4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 6px}
.stat{text-align:center;padding:4px 6px;border-left:1px solid var(--line)}
.stat:first-child{border-left:none}
.stat svg{width:26px;height:26px}
.stat b{display:block;font-family:var(--display);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.warm{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:14px;align-items:center;background:var(--surface)}
.warm svg{width:34px;height:34px;flex:0 0 auto}
.warm b{font-size:19px;display:block}
.ex{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0}
.thumb{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:22px;color:#fff}
.ex .eq{font-size:13px;color:var(--muted)}
.ex .nm{font-size:17px;line-height:1.25;margin:1px 0 6px}
.info{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-family:Georgia,serif;font-style:italic}
.pills{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.pills span{padding:3px 10px;border-left:1px solid var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.pills span:first-child{border-left:none}
.pills b{font-family:var(--display);font-size:21px;color:var(--ink);margin-right:3px}
.rest-sep{display:flex;align-items:center;gap:10px;color:var(--muted);margin:6px 0 6px 20px}
.rest-sep::before,.rest-sep::after{content:"";height:1px;background:var(--line);flex:1}
.rest-sep b{font-family:var(--display);font-size:22px;color:var(--ink)}
.cta{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:12px 16px;background:linear-gradient(transparent,var(--bg) 35%);z-index:15}
.cta .in{max-width:528px;margin:0 auto;display:flex;gap:10px}
.btn{border:none;border-radius:14px;padding:16px;font-weight:700;background:#fff;color:#0B0B0D;letter-spacing:.6px;text-transform:uppercase;font-size:16px;flex:1}
.btn.ghost{background:var(--surface2);color:var(--ink);text-transform:none;letter-spacing:0;font-weight:600}
.btn.small{flex:0 0 auto;padding:9px 14px;font-size:14px;border-radius:10px;text-transform:none;letter-spacing:0}
.btn.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;padding:8px 0;font-size:15px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#121316;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
nav.tabs button{background:none;border:none;padding:9px 0 12px;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px}
nav.tabs svg{width:22px;height:22px}
nav.tabs button.on{color:var(--ink);font-weight:700}
.card{background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.card.done{outline:1px solid var(--ok)}
.chead{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.thumb.pic{background:#ECEDF1}
.thumb.pic svg{width:92%;height:92%}
svg .q{stroke:#8D93A1;stroke-width:3.6}
svg .qf{fill:#8D93A1;stroke:none}
svg .ar{stroke:#FF6A00;stroke-width:3;fill:none}
svg .arh{fill:#FF6A00;stroke:none}
.bigpic{display:block;width:100%;max-width:260px;margin:12px auto;background:#ECEDF1;border-radius:18px;padding:8px}
.es{font-size:13px;color:var(--muted);margin:-3px 0 6px;display:flex;gap:6px;align-items:baseline}
.es span{font-size:10px;font-weight:700;letter-spacing:.5px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--accent)}
.chead .es{margin:2px 0 0}
.wl{display:grid;gap:4px;margin-top:10px}
.wi{display:grid;grid-template-columns:48px 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.wi .thumb{width:48px;height:48px;font-size:16px;border-radius:10px}
.wi .wn{font-size:15px;line-height:1.25}
.wi .es{margin:2px 0 0}
.wq{white-space:nowrap;color:var(--muted);font-size:13px}.wq b{font-family:var(--display);font-size:20px;color:var(--ink)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.daynav b{font-size:18px}
.kcalhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.kc{font-family:var(--display);font-size:38px}
.mbar{margin-top:8px}.mrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.mrow b{color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;margin-top:4px}.track i{display:block;height:100%;border-radius:6px}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.fi{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fi .sub{font-size:12px}
.pillk{font-family:var(--display);font-size:20px;color:var(--accent)}
dl.menu{margin:10px 0 0;font-size:14px}dl.menu dt{color:var(--accent);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;margin-top:8px}dl.menu dd{margin:2px 0 0}
.addrow{display:flex;gap:8px;align-items:end}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.ci:first-child{border-top:none}.ci input{width:22px;height:22px;accent-color:var(--ok)}
.ci.got span{text-decoration:line-through;color:var(--muted)}
.fld select{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:0 10px;font-size:16px;width:100%}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:12px;color:var(--muted);padding:4px 0}
.cd{aspect-ratio:1;border:none;border-radius:10px;background:var(--surface2);font-weight:600;font-size:15px;display:grid;place-items:center;align-content:center;gap:2px;padding:0}
.cd:disabled{opacity:.25}
.cd.today{outline:2px solid #fff}
.cd.tr{background:#3A2A0C}
.mk{display:flex;gap:3px;height:6px}.mk i{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.mon{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px}
details.sess.card summary{align-items:center;gap:12px}
.dbox{width:46px;height:46px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;align-content:center;line-height:1}
.dbox b{font-family:var(--display);font-size:22px}.dbox span{font-size:11px;color:var(--muted);text-transform:uppercase}
.dpick{position:relative;display:grid;justify-items:center;cursor:pointer}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.chead .thumb{width:48px;height:48px;font-size:18px;border-radius:10px}
.last{font-size:13px;color:var(--muted);margin-top:8px}
.last b{color:var(--ink);font-variant-numeric:tabular-nums}
.sets{display:grid;gap:8px;margin-top:10px}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 50px;gap:8px;align-items:center}
.setrow .n{font-family:var(--display);font-size:19px;color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:0 38px 0 12px;font-size:18px;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.field small{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
.check{height:46px;border-radius:10px;border:2px solid var(--line);background:transparent;font-size:20px;color:var(--muted)}
.setrow.done .check{background:var(--ok);border-color:var(--ok);color:#06130C}
.setrow.done input{border-color:transparent;color:var(--ok)}
.rounds{display:flex;gap:8px;margin-top:12px}
.round{flex:1;height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;font-weight:600}
.round.on{background:var(--ok);border-color:var(--ok);color:#06130C}
.wlist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:15px}
.wlist li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.wlist li span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.timer{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));max-width:536px;margin:0 auto;background:#fff;color:#0B0B0D;border-radius:16px;padding:12px 14px;z-index:30;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.timer.show{display:block}
.timer .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.timer .t{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.timer .lbl{font-size:12px;color:#555}
.timer .ctrl{display:flex;gap:6px}
.timer .ctrl button{border:1px solid #0B0B0D;background:transparent;border-radius:9px;padding:7px 9px;font-size:14px}
.timer .pb{height:4px;background:#ddd;border-radius:4px;margin-top:10px;overflow:hidden}
.timer .pb i{display:block;height:100%;background:var(--accent);width:100%}
.timer.fin{background:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.tile{background:var(--surface);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.mtile{text-align:left;border:1px solid transparent;color:var(--ink);font:inherit}
.mtile.on{border-color:var(--accent)}
.mtile span{display:block;margin-bottom:4px}
.tile b small{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:500}
.tile em{display:block;margin-top:4px;font-style:normal;font-size:13px;font-weight:600}
.up{color:var(--danger)} .down{color:var(--ok)}
.prog{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prog:first-child{border-top:none}
.prog .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .v b{color:var(--ok)}
details.sess{border-top:1px solid var(--line);padding:12px 0}
details.sess:first-child{border-top:none}
details.sess summary{list-style:none;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
details.sess summary::-webkit-details-marker{display:none}
.sess .d{font-size:13px;color:var(--muted)}
.sess table,.btable{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px;font-variant-numeric:tabular-nums}
.sess td,.btable td,.btable th{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.btable th{color:var(--muted);font-weight:500;font-size:12px}
.sess td:last-child{text-align:right;color:var(--muted)}
.tablewrap{overflow-x:auto}
.empty{color:var(--muted);padding:6px 0}
.ed{background:var(--surface);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ed label,.fld{font-size:12px;color:var(--muted);display:grid;gap:3px}
.ed .c6{grid-column:span 6}.ed .c3{grid-column:span 3}.ed .c2{grid-column:span 2}
.ed input,.ed select,.fld input,.search{height:42px;border:1px solid var(--line);border-radius:9px;background:var(--surface2);padding:0 10px;font-size:16px;width:100%}
.ed .del{grid-column:span 6;justify-self:end}
.fld{margin-bottom:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 6px;padding:0 16px 4px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip.on{background:#fff;color:#0B0B0D;border-color:#fff;font-weight:600}
.lib{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lib:first-child{border-top:none}
.lib .thumb{width:48px;height:48px;font-size:17px;border-radius:10px}
.lib .t{font-weight:600;line-height:1.25}
.lib .s{font-size:13px;color:var(--muted)}
.add{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:22px;line-height:1}
.chart{width:100%;height:auto;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;max-width:520px;width:100%;max-height:85vh;overflow-y:auto}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);background:#fff;color:#0B0B0D;padding:10px 14px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90%;font-weight:600}
.toast.show{display:block}
@media (prefers-reduced-motion:no-preference){.timer .pb i{transition:width .25s linear}}
</style>
</head>
<body>
<div class="wrap"><main id="main"></main></div>
<div class="cta" id="cta"></div>

<div class="timer" id="timer" role="timer" aria-live="polite">
  <div class="row">
    <div><div class="lbl" id="tLbl">Descanso</div><div class="t" id="tT">0:00</div></div>
    <div class="ctrl"><button data-act="t-minus">−15 s</button><button data-act="t-plus">+15 s</button><button data-act="t-skip">Saltar</button></div>
  </div>
  <div class="pb"><i id="tBar"></i></div>
</div>

<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-tab="rutinas" id="tab-rutinas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Rutinas</button>
  <button data-tab="biblioteca" id="tab-biblioteca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h5v14H4zM10 5h5v14h-5zM16 6l4 1-3 12-4-1"/></svg>Biblioteca</button>
  <button data-tab="comida" id="tab-comida"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1-3 4-3 8h3"/></svg>Comida</button>
  <button data-tab="cuerpo" id="tab-cuerpo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><path d="M6 10h12M12 10v5M9 21l3-6 3 6"/></svg>Cuerpo</button>
  <button data-tab="progreso" id="tab-progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg>Registro</button>
</div></nav>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const nid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(",", ".")); return isFinite(n) ? n : 0; };
const fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const fmtKg = n => (Math.round(n * 100) / 100).toLocaleString("es-ES");
const fmtDur = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(Math.round(m % 60)).padStart(2, "0") + ":00";
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtDay = iso => new Date(iso + (iso.length === 10 ? "T12:00" : "")).toLocaleDateString("es-ES", {day: "numeric", month: "short"});
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\(.*?\)/g, "").replace(/[–-]/g, " ").replace(/\s+/g, " ").trim();

async function connect(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    try { isOwner = !!(await user.isOwner()); } catch(e){}
    try { const me = await user.me(); userName = (me && me.name || "").split(" ")[0]; if (view === "rutinas") render(); } catch(e){}
    ref = db.doc("data/users/" + uid + "/migym");
    setStatus("cargando");
    const timer = setTimeout(() => setStatus("lento"), 10000);
    let first = true;
    ref.onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      if (snap.exists){
        const s = JSON.stringify(snap.data());
        if (s !== lastSynced && s !== JSON.stringify(state)){
          const d = JSON.parse(s);
          if (d.version === 2){ state = normalize(d); lsSet(LS, state); if (view !== "entreno" && view !== "editar") render(); }
        }
        lastSynced = s;
        if (!snap.metadata.fromCache && !snap.metadata.hasPendingWrites) setStatus("cuenta");
      } else if (!snap.metadata.fromCache && first){
        first = false;
        if (isOwner || (stored && stored.version === 2 && stored.historial && stored.historial.length)) persist();
        else welcome();     // persona nueva: elige cómo empezar
      }
    }, () => { clearTimeout(timer); ref = null; setStatus("local"); });
  } catch(e){ ref = null; setStatus("local"); }
}

  openModal(`<div class="big" style="font-size:32px">¡Bienvenid@ a Mi Gym!</div>
    <p class="sub">Todo se guarda solo en este móvil: no hace falta cuenta y nadie más ve tus datos. ¿Cómo quieres empezar?</p>
    <div class="actions" style="flex-direction:column">
      <button class="btn" data-act="start-sample">Con 3 rutinas de ejemplo</button>
      <button class="btn ghost" data-act="start-blank">Desde cero</button></div>

}

/* ---------- utilidades ---------- */
const getR = id => state.rutinas.find(r => r.id === id);
function suggested(){
  if (!state.rutinas.length) return null;
  const last = state.historial[0]; if (!last) return state.rutinas[0].id;
  const i = state.rutinas.findIndex(r => r.id === last.rutinaId);
  return state.rutinas[(i + 1) % state.rutinas.length].id;
}
function weekCount(){ const x = new Date(); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return state.historial.filter(h => new Date(h.fecha) >= x).length; }
function estMin(r){
  const w = r.calentamiento.length * r.rondas * 0.75 + (r.calentamiento.length ? 1 : 0);
  return Math.round(w + r.ejercicios.reduce((a, e) => a + e.series * (45 + num(e.descanso)) / 60 + 1, 0));
}
function lastFor(nombre){ for (const h of state.historial){ const e = h.ejercicios.find(x => x.nombre === nombre); if (e && e.sets.length) return e.sets; } return null; }
const doneSets = () => !session ? 0 : Object.values(session.sets).reduce((a, s) => a + s.filter(x => x.hecho).length, 0);
const infoBtn = n => libFor(n) ? `<button class="info" data-act="info" data-n="${esc(n)}" aria-label="Cómo se hace ${esc(n)}">i</button>` : "<span></span>";

/* ---------- vistas ---------- */
function render(){
  const tab = ["biblioteca","comida","cuerpo","progreso"].includes(view) ? view : "rutinas";
  TABS.forEach(t => $("tab-" + t).classList.toggle("on", t === tab));
  const out = ({rutinas: vHome, rutina: vRutina, entreno: vEntreno, progreso: vProgreso, editar: vEditar, biblioteca: vLib, cuerpo: vCuerpo, comida: vComida}[view] || vHome)();
  $("main").innerHTML = out.html;
  $("cta").innerHTML = out.cta ? `<div class="in">${out.cta}</div>` : "";
  setStatus(statusKey);
  if (view === "biblioteca") fillLib();
  tickElapsed();
}

function exRow(e, isWarm){
  const pills = isWarm ? `<span><b>${esc(e.cant)}</b>${esc(e.unidad)}</span>`
    : `<span><b>${e.series}</b>series</span><span><b>${esc(e.reps)}</b>reps</span><span><b>${fmtKg(num(e.kg))}</b>kg</span>`;
  return `<div class="ex">${thumb(e.nombre, e.equipo)}
    <div><div class="eq">${esc(e.equipo || "")}</div><div class="nm">${esc(e.nombre)}</div>${esLine(e.nombre)}<div class="pills">${pills}</div></div>${infoBtn(e.nombre)}</div>`;

      <div class="rounds">${session.rondas.map((on, i) => `<button class="round${on ? " on" : ""}" data-act="round" data-i="${i}" aria-pressed="${on}">Ronda ${i + 1} ${on ? "✓" : ""}</button>`).join("")}</div></section>`;

    h += `<section class="card${all ? " done" : ""}"><div class="chead">${thumb(ej.nombre, ej.equipo)}
      <div><div class="sub">${esc(ej.equipo || "")} · descanso ${fmtT(num(ej.descanso))}</div><b>${esc(ej.nombre)}</b>${esLine(ej.nombre)}</div>${infoBtn(ej.nombre)}</div>
      <div class="last">${last ? `Última vez: <b>${last.map(s => fmtKg(s.kg) + "×" + s.reps).join(" · ")}</b>` : `Objetivo: <b>${ej.series} × ${esc(ej.reps)} · ${fmtKg(num(ej.kg))} kg</b>`}</div>
      <div class="sets">` + sets.map((s, i) => `<div class="setrow${s.hecho ? " done" : ""}"><span class="n">${i + 1}</span>

        <div class="field"><input inputmode="numeric" id="rp-${ej.id}-${i}" aria-label="Repeticiones serie ${i + 1}" data-in="reps" data-ej="${ej.id}" data-i="${i}" value="${esc(s.reps)}"><small>reps</small></div>

  h += `<div class="actions" style="justify-content:center"><button class="linkbtn" style="color:var(--danger)" data-act="discard">${armed === "discard" ? "Toca otra vez para descartar el entreno" : "Descartar entreno"}</button></div>`;

}
function mkSets(ej){ return Array.from({length: Math.max(1, ej.series)}, () => ({kg: ej.kg ? String(ej.kg).replace(".", ",") : "", reps: String(num(ej.reps) || ""), hecho: false})); }
function volNow(){ let v = 0; if (session) Object.values(session.sets).forEach(a => a.forEach(s => { if (s.hecho) v += num(s.kg) * num(s.reps); })); return Math.round(v); }

function spark(vals){
  const w = 120, hh = 34, p = 4;
  if (vals.length < 2) return `<svg width="${w}" height="${hh}" aria-hidden="true"><circle cx="${w - p}" cy="${hh / 2}" r="3.5" fill="var(--accent)"/></svg>`;
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [p + i * (w - 2 * p) / (vals.length - 1), hh - p - (v - mn) / rg * (hh - 2 * p)]);
  const line = pts.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" "), l = pts[pts.length - 1];
  return `<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" aria-hidden="true"><polygon points="${p},${hh} ${line} ${w - p},${hh}" fill="var(--accent)" opacity=".15"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3.5" fill="var(--accent)"/></svg>`;
}

const cap1 = t => t.charAt(0).toUpperCase() + t.slice(1);
const isoLocal = d => { d = new Date(d); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const longDay = iso => new Date(iso + "T12:00").toLocaleDateString("es-ES", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
const hora = iso => new Date(iso).toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
let calMonth = today().slice(0, 7);
function dayMarks(){
  const m = {};
  const add = (iso, k) => { (m[iso] = m[iso] || {})[k] = true; };
  state.historial.forEach(s => add(isoLocal(s.fecha), "e"));
  Object.entries(state.comidas).forEach(([iso, log]) => { if (Object.values(log).some(a => a && a.length)) add(iso, "c"); });
  state.cuerpo.forEach(c => add(c.fecha, "b"));
  return m;
}
function calendar(){
  const [y, mo] = calMonth.split("-").map(Number), first = new Date(y, mo - 1, 1), days = new Date(y, mo, 0).getDate();
  const lead = (first.getDay() + 6) % 7, marks = dayMarks(), t = today();
  const title = first.toLocaleDateString("es-ES", {month: "long", year: "numeric"});
  let h = `<div class="card"><div class="calhead"><button class="iconbtn" data-act="calm" data-d="-1" aria-label="Mes anterior">${I.back}</button><b>${cap1(title)}</b>
    <button class="iconbtn" data-act="calm" data-d="1" aria-label="Mes siguiente" ${calMonth >= t.slice(0, 7) ? "disabled style='opacity:.3'" : ""}>${I.back.replace("<svg", '<svg style="transform:rotate(180deg)"')}</button></div>
    <div class="cal">${["L","M","X","J","V","S","D"].map(d => `<span class="dow">${d}</span>`).join("")}${"<span></span>".repeat(lead)}`;
  for (let d = 1; d <= days; d++){
    const iso = calMonth + "-" + String(d).padStart(2, "0"), mk = marks[iso] || {}, fut = iso > t;
    h += `<button class="cd${iso === t ? " today" : ""}${mk.e ? " tr" : ""}" ${fut ? "disabled" : ""} data-act="dayopen" data-d="${iso}" aria-label="${longDay(iso)}">${d}<span class="mk">${mk.e ? '<i style="background:var(--accent)"></i>' : ""}${mk.c ? '<i style="background:var(--ok)"></i>' : ""}${mk.b ? '<i style="background:var(--blue)"></i>' : ""}</span></button>`;
  }
  return h + `</div><div class="legend"><span><i style="background:var(--accent)"></i>Entreno</span><span><i style="background:var(--ok)"></i>Comidas</span><span><i style="background:var(--blue)"></i>Medidas</span></div>
    <p class="sub" style="margin:6px 0 0">Toca un día para ver todo lo que registraste.</p></div>`;
}
function openDay(iso){
  const W = state.historial.filter(s => isoLocal(s.fecha) === iso), log = state.comidas[iso] || {}, B = state.cuerpo.filter(c => c.fecha === iso);
  let h = `<div class="sub">${cap1(longDay(iso))}</div><div class="big" style="font-size:30px">Registro del día</div>`;
  h += `<h2 style="margin-top:16px">Entreno</h2>`;
  if (!W.length) h += `<p class="empty">Sin entreno.</p>`;
  W.forEach(s => { h += `<div class="card" style="background:var(--surface2)"><b>${esc(s.rutinaNombre)}</b> <span class="sub">· ${hora(s.fecha)} · ${s.duracionMin} min · ${s.series} series · ${fmtKg(s.volumen)} kg</span>
    <table class="btable">${s.ejercicios.map(e => `<tr><td>${esc(e.nombre)}</td><td style="text-align:right;color:var(--muted)">${e.sets.map(x => fmtKg(x.kg) + "×" + x.reps).join(", ")}</td></tr>`).join("")}</table></div>`; });
  const all = MEALS.flatMap(([k]) => log[k] || []);
  h += `<h2>Comidas</h2>`;
  if (!all.length) h += `<p class="empty">Sin comidas apuntadas.</p>`;
  else {
    const t = sumItems(all);
    h += `<div class="card" style="background:var(--surface2)"><b>${Math.round(t.kcal)} kcal</b> <span class="sub">· P ${Math.round(t.p)} g · H ${Math.round(t.c)} g · G ${Math.round(t.g)} g</span>` +
      MEALS.filter(([k]) => (log[k] || []).length).map(([k, l]) => `<div style="margin-top:8px"><span class="sub" style="color:var(--accent);font-weight:600">${l}</span><div style="font-size:14px">${log[k].map(x => esc(x.n)).join(", ")} <span class="sub">(${Math.round(sumItems(log[k]).kcal)} kcal)</span></div></div>`).join("") + `</div>`;
  }
  h += `<h2>Medidas</h2>`;
  if (!B.length) h += `<p class="empty">Sin medidas.</p>`;
  B.forEach(c => { h += `<div class="card" style="background:var(--surface2)">${MET.filter(m => mval(c, m.k)).map(m => `<div class="mrow" style="padding:3px 0"><span>${m.l}</span><span><b>${fmtKg(mval(c, m.k))}</b> ${m.u}</span></div>`).join("")}</div>`; });
  h += `<div class="actions"><button class="btn small" data-act="dayfood" data-d="${iso}">Ver o editar comidas de ese día</button><button class="btn ghost small" data-act="close">Cerrar</button></div>`;
  openModal(h);
}

function vProgreso(){
  const H = state.historial, now = new Date();
  const mes = H.filter(x => { const d = new Date(x.fecha); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).length;
  let h = `<div style="margin-bottom:8px"><div class="big">Registro</div><div class="status" id="status"></div></div>
    <div class="tiles"><div class="tile"><b>${weekCount()}</b><span>entrenos esta semana</span></div><div class="tile"><b>${mes}</b><span>este mes</span></div><div class="tile"><b>${H.length}</b><span>en total</span></div></div>
    <h2>Calendario</h2>${calendar()}
    <h2>Peso por ejercicio</h2><div class="card">`;
  const map = new Map();
  H.slice().reverse().forEach(s => s.ejercicios.forEach(e => { const m = Math.max(0, ...e.sets.map(x => num(x.kg))); if (m){ if (!map.has(e.nombre)) map.set(e.nombre, []); map.get(e.nombre).push(m); } }));
  if (!map.size) h += `<p class="empty">Cuando guardes tu primer entreno, aquí verás cómo sube el peso de cada ejercicio.</p>`;
  map.forEach((v, nm) => { const best = Math.max(...v), d = v[v.length - 1] - v[0];
    h += `<div class="prog"><div><b>${esc(nm)}</b><div class="v">Último ${fmtKg(v[v.length - 1])} kg · récord ${fmtKg(best)} kg${v.length > 1 && d > 0 ? ` · <b>+${fmtKg(d)} kg</b>` : ""}</div></div>${spark(v.slice(-10))}</div>`; });
  h += `</div><h2>Entrenos por fecha</h2>`;
  if (!H.length) h += `<div class="card"><p class="empty">Aún no hay entrenos. Empieza una rutina y pulsa «Terminar y guardar».</p></div>`;
  let lastMonth = "";
  H.slice(0, 80).forEach(s => {
    const iso = isoLocal(s.fecha), mon = new Date(iso + "T12:00").toLocaleDateString("es-ES", {month: "long", year: "numeric"});
    if (mon !== lastMonth){ h += `<div class="mon">${mon}</div>`; lastMonth = mon; }
    const d = new Date(iso + "T12:00");
    h += `<details class="sess card" style="padding:12px 14px;margin-bottom:8px"><summary><div class="dbox"><b>${d.getDate()}</b><span>${d.toLocaleDateString("es-ES", {weekday: "short"})}</span></div>
      <div style="flex:1"><b>${esc(s.rutinaNombre)}</b><div class="d">${hora(s.fecha)} · ${s.duracionMin} min · ${s.series} series · ${fmtKg(s.volumen)} kg</div></div><span class="sub">Ver</span></summary>
      <table>${s.ejercicios.map(e => `<tr><td>${esc(e.nombre)}</td><td>${e.sets.map(x => fmtKg(x.kg) + "×" + x.reps).join(", ")}</td></tr>`).join("")}</table>
      <button class="linkbtn" style="color:var(--danger)" data-act="delsess" data-id="${s.id}">${armed === s.id ? "Toca otra vez para borrar" : "Borrar este entreno"}</button></details>`;
  });
  h += `<h2>Exportar mis datos</h2><div class="card"><p class="sub" style="margin-top:0">Descarga todo en un Excel con una hoja para cada cosa: entrenos serie a serie, resumen de entrenos, rutinas, comidas, totales diarios, medidas del cuerpo y lista de la compra.</p>
    <div class="actions"><button class="btn small" data-act="xlsx">Descargar Excel</button><button class="btn ghost small" data-act="backup">Copia de seguridad</button>
    <button class="btn ghost small" data-act="csv">Copiar al portapapeles</button></div>
    <p class="sub">Tus datos están solo en este móvil: descarga una copia de seguridad (.json) de vez en cuando y guárdala en Archivos o iCloud. Si cambias de móvil o borras Safari, la restauras aquí. <label for="restore" class="linkbtn" style="cursor:pointer">Restaurar una copia</label><input type="file" id="restore" accept=".json,application/json" hidden></p></div>`;
  return {html: h};
}

/* ---------- exportar ---------- */
const dowName = iso => new Date(iso + "T12:00").toLocaleDateString("es-ES", {weekday: "long"});
function sheetsData(){
  const S = {};
  S["Entrenos (series)"] = [["Fecha","Día","Hora","Rutina","Ejercicio","Ejercicio (ES)","Serie","Kg","Reps","Kg × reps"]];
  S["Entrenos (resumen)"] = [["Fecha","Día","Hora","Rutina","Duración (min)","Series","Kg movidos","Rondas calentamiento"]];
  state.historial.slice().reverse().forEach(s => {
    const iso = isoLocal(s.fecha);
    S["Entrenos (resumen)"].push([iso, dowName(iso), hora(s.fecha), s.rutinaNombre, s.duracionMin, s.series, s.volumen, s.rondasCalentamiento || 0]);
    s.ejercicios.forEach(e => e.sets.forEach((x, i) => S["Entrenos (series)"].push([iso, dowName(iso), hora(s.fecha), s.rutinaNombre, e.nombre, trad(e.nombre) || e.nombre, i + 1, x.kg, x.reps, Math.round(x.kg * x.reps * 10) / 10])));
  });
  S["Rutinas"] = [["Rutina","Parte","Ejercicio","Ejercicio (ES)","Equipo","Series / rondas","Reps / cantidad","Kg","Descanso (s)"]];
  state.rutinas.forEach(r => {
    r.calentamiento.forEach(w => S["Rutinas"].push([r.nombre, "Calentamiento", w.nombre, trad(w.nombre) || w.nombre, w.equipo, r.rondas, w.cant + " " + w.unidad, "", ""]));
    r.ejercicios.forEach(e => S["Rutinas"].push([r.nombre, "Principal", e.nombre, trad(e.nombre) || e.nombre, e.equipo, e.series, e.reps, num(e.kg), num(e.descanso)]));
  });
  S["Comidas"] = [["Fecha","Día","Comida","Alimento","Ración","kcal","Proteína (g)","Hidratos (g)","Grasa (g)"]];
  S["Comidas (por día)"] = [["Fecha","Día","kcal","Proteína (g)","Hidratos (g)","Grasa (g)","Objetivo kcal","Diferencia"]];
  const T = targets();
  Object.keys(state.comidas).sort().forEach(iso => {
    const log = state.comidas[iso], all = [];
    MEALS.forEach(([k, l]) => (log[k] || []).forEach(x => { all.push(x); S["Comidas"].push([iso, dowName(iso), l, x.n, x.por || "", num(x.kcal), num(x.p), num(x.c), num(x.g)]); }));
    if (all.length){ const t = sumItems(all); S["Comidas (por día)"].push([iso, dowName(iso), Math.round(t.kcal), r1(t.p), r1(t.c), r1(t.g), T.kcal || "", T.kcal ? Math.round(t.kcal - T.kcal) : ""]); }
  });
  const ms = MET.filter(m => state.cuerpo.some(c => mval(c, m.k)));
  S["Cuerpo"] = [["Fecha","Día", ...ms.map(m => m.l + (m.u ? " (" + m.u + ")" : ""))]];
  state.cuerpo.slice().sort((a, b) => a.fecha < b.fecha ? -1 : 1).forEach(c => S["Cuerpo"].push([c.fecha, dowName(c.fecha), ...ms.map(m => mval(c, m.k) || "")]));
  S["Compra"] = [["Producto","Sección","Comprado"]];
  state.compra.forEach(x => S["Compra"].push([x.n, x.cat || "Otros", x.hecho ? "Sí" : "No"]));
  return S;
}
async function saveFile(filename, data){
  const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith(".json") ? "application/json" : "text/plain"});
  const type = filename.endsWith(".xlsx") ? "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" : blob.type;
  try {
    const file = new File([blob], filename, {type});
    if (navigator.canShare && navigator.canShare({files: [file]})){ await navigator.share({files: [file], title: filename}); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  const url = URL.createObjectURL(new Blob([blob], {type}));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Archivo descargado");
}
async function exportXlsx(){
  if (!window.XLSX){ toast("El Excel no ha cargado. Prueba «Copiar al portapapeles»"); return; }
  const wb = XLSX.utils.book_new(), S = sheetsData();
  Object.entries(S).forEach(([name, rows]) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"] = rows[0].map((_, i) => ({wch: Math.min(40, Math.max(8, ...rows.map(r => String(r[i] == null ? "" : r[i]).length + 2)))}));
    if (rows.length > 1) ws["!autofilter"] = {ref: XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: rows.length - 1, c: rows[0].length - 1}})};
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  const buf = XLSX.write(wb, {type: "array", bookType: "xlsx"});
  await saveFile("MiGym_" + today() + ".xlsx", new Blob([buf]));
}

function libMatches(q, g){
  const nq = norm(q);
  return LIB.filter(l => (g === "Todos" || l.grupo === g) && (!nq || norm(l.nombre + " " + l.en + " " + l.equipo + " " + l.grupo).includes(nq)));
}

const mval = (c, k) => k === "imc" ? (c.peso && state.altura ? Math.round(c.peso / Math.pow(state.altura / 100, 2) * 10) / 10 : 0) : num(c[k]);
function vCuerpo(){
  const C = state.cuerpo.slice().sort((a, b) => a.fecha < b.fecha ? 1 : -1);   // más reciente primero
  const has = k => C.some(c => mval(c, k));
  const shown = MET.filter(m => has(m.k));
  const dl = (m, a, b) => {
    const d = Math.round((a - b) * 10) / 10;
    if (!d) return `<em class="sub">=</em>`;
    const cls = m.good === 0 ? "sub" : ((d > 0) === (m.good > 0) ? "down" : "up");
    return `<em class="${cls}">${d > 0 ? "▲ +" : "▼ "}${fmtKg(d)}</em>`;
  };
  let h = `<div style="margin-bottom:8px"><div class="big">Cuerpo</div><div class="sub">Peso, composición de la báscula y medidas con cinta. Pésate siempre en las mismas condiciones: en ayunas y a la misma hora.</div></div>`;
  if (shown.length){
    h += `<div class="tiles">` + shown.map(m => {
      const s = C.filter(c => mval(c, m.k)), last = mval(s[0], m.k), prev = s[1] ? mval(s[1], m.k) : null;
      return `<button class="tile mtile${bodyM === m.k ? " on" : ""}" data-act="bm" data-k="${m.k}"><span>${m.l}</span><b>${fmtKg(last)}<small> ${m.u}</small></b>${prev != null ? dl(m, last, prev) : `<em class="sub">primer dato</em>`}</button>`;
    }).join("") + `</div><p class="sub" style="margin:6px 0 0">▲▼ = cambio desde la medición anterior. Verde, va en buena dirección. Toca una tarjeta para ver su gráfica.</p>`;
  }
  const cm = MET.find(m => m.k === bodyM) || MET[0];
  const pts = C.filter(c => mval(c, cm.k)).reverse().map(c => ({fecha: c.fecha, v: mval(c, cm.k)}));
  h += `<div class="card" style="margin-top:12px"><b>${cm.l}${cm.u ? " (" + cm.u + ")" : ""}</b>${pts.length > 1 ? ` <span class="sub">· desde el inicio ${dl(cm, pts[pts.length - 1].v, pts[0].v)}</span>` : ""}${chartW(pts, cm.l)}</div>`;
  const inp = (m) => `<label class="fld" for="b-${m.k}">${m.l}${m.u ? " (" + m.u + ")" : ""}<input id="b-${m.k}" inputmode="decimal"></label>`;
  h += `<h2>Nuevo registro</h2><div class="card">
    <label class="fld" for="cf" style="max-width:200px">Fecha<input id="cf" type="date" value="${today()}"></label>
    <b>Báscula</b><div class="grid3" style="margin-top:8px">${MET.filter(m => m.g === "b").map(inp).join("")}</div>
    <b>Cinta métrica</b><div class="grid3" style="margin-top:8px">${MET.filter(m => m.g === "c").map(inp).join("")}</div>
    <p class="sub">Rellena solo lo que tengas: todos los campos son opcionales.</p>
    <div class="actions"><button class="btn small" data-act="body-add">Guardar registro</button></div></div>
    <label class="fld" for="alt" style="max-width:240px;margin-top:4px">Tu altura (cm), para calcular el IMC<input id="alt" inputmode="numeric" data-f="altura" value="${state.altura || ""}" placeholder="165"></label>`;
  h += `<h2>Historial</h2><div class="card">`;
  if (!C.length) h += `<p class="empty">Aún no hay registros. Apunta lo que te marque la báscula hoy para empezar a ver la evolución.</p>`;
  else {
    const cols = MET.filter(m => has(m.k));
    h += `<div class="tablewrap"><table class="btable"><tr><th>Fecha</th>${cols.map(m => `<th>${m.l}</th>`).join("")}<th></th></tr>`
      + C.map(c => `<tr><td style="white-space:nowrap">${fmtDay(c.fecha)}</td>${cols.map(m => `<td>${mval(c, m.k) ? fmtKg(mval(c, m.k)) : "–"}</td>`).join("")}
        <td><button class="linkbtn" style="color:var(--danger);padding:0" data-act="body-del" data-id="${c.id}" aria-label="Borrar registro">${armed === c.id ? "¿Borrar?" : "✕"}</button></td></tr>`).join("") + `</table></div>`;
  }
  return {html: h + `</div>`};
}
function chartW(pts, label){
  if (pts.length < 2) return `<p class="empty">${pts.length ? "Con un registro más verás la línea de evolución." : "Aquí aparecerá la gráfica cuando registres datos."}</p>`;
  const w = 340, hh = 170, l = 40, r = 12, t = 14, b = 26;
  const v = pts.map(p => p.v), span = Math.max(...v) - Math.min(...v), pad = Math.max(span * .15, .5);
  const mn = Math.min(...v) - pad, mx = Math.max(...v) + pad, rg = mx - mn;
  const t0 = new Date(pts[0].fecha).getTime(), t1 = new Date(pts[pts.length - 1].fecha).getTime(), tr = t1 - t0 || 1;
  const X = d => l + (new Date(d).getTime() - t0) / tr * (w - l - r), Y = k => t + (mx - k) / rg * (hh - t - b);
  const line = pts.map(p => X(p.fecha).toFixed(1) + "," + Y(p.v).toFixed(1)).join(" ");
  const ticks = [mn + rg * .1, (mn + mx) / 2, mx - rg * .1].map(k => Math.round(k * 10) / 10), lp = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${hh}" role="img" aria-label="${esc(label)}: de ${fmtKg(pts[0].v)} a ${fmtKg(lp.v)}">
    ${ticks.map(k => `<line x1="${l}" x2="${w - r}" y1="${Y(k)}" y2="${Y(k)}" stroke="var(--line)"/><text x="${l - 6}" y="${Y(k) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtKg(k)}</text>`).join("")}
    <polygon points="${l},${hh - b} ${line} ${X(lp.fecha).toFixed(1)},${hh - b}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${X(p.fecha).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join("")}
    <circle cx="${X(lp.fecha).toFixed(1)}" cy="${Y(lp.v).toFixed(1)}" r="5" fill="var(--accent)"/>
    <text x="${X(lp.fecha) - 8}" y="${Y(lp.v) - 9}" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">${fmtKg(lp.v)}</text>
    <text x="${l}" y="${hh - 6}" font-size="11" fill="var(--muted)">${fmtDay(pts[0].fecha)}</text>
    <text x="${w - r}" y="${hh - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDay(lp.fecha)}</text></svg>`;
}

function targets(){
  const nu = state.nutri, last = state.cuerpo.slice().sort((a, b) => a.fecha < b.fecha ? 1 : -1);
  const peso = (last.find(c => c.peso) || {}).peso, bmrScale = (last.find(c => c.bmr) || {}).bmr;
  const alt = state.altura, edad = num(nu.edad), mujer = nu.sexo !== "hombre";
  let bmr = 0, src = "";
  if (bmrScale){ bmr = bmrScale; src = "tu báscula"; }
  else if (peso && alt && edad){ bmr = Math.round(10 * peso + 6.25 * alt - 5 * edad + (mujer ? -161 : 5)); src = "fórmula Mifflin-St Jeor"; }
  if (!bmr) return {falta: !peso ? "tu peso (en Cuerpo)" : !alt ? "tu altura (en Cuerpo)" : "tu edad (aquí abajo)"};
  const act = num(nu.actividad) || 1.55, def = nu.deficit == null ? 0.2 : num(nu.deficit);
  const tdee = Math.round(bmr * act), floor = mujer ? 1200 : 1500;
  let kcal = num(nu.kcal) || Math.max(floor, Math.round(tdee * (1 - def) / 10) * 10);
  const p = peso ? Math.round(peso * 1.8) : Math.round(kcal * 0.3 / 4), g = peso ? Math.round(peso * 0.8) : Math.round(kcal * 0.28 / 9);
  const c = Math.max(0, Math.round((kcal - p * 4 - g * 9) / 4));
  return {bmr, src, tdee, kcal, p, c, g, peso, floorHit: !num(nu.kcal) && kcal === floor && tdee * (1 - def) < floor};
}

const T = {end: 0, total: 0, iv: null, ex: ""};
let actx = null;
function beep(){ try { if (!actx) return; [0, .22].forEach(t => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(.25, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t + .18); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .2); }); } catch(e){} }
function startRest(sec, nombre){
  if (!sec) return;
  T.total = sec; T.end = Date.now() + sec * 1000; T.ex = nombre;
  $("timer").classList.add("show"); $("timer").classList.remove("fin");
  clearInterval(T.iv); T.iv = setInterval(tick, 250); tick();
}
function tick(){
  const left = Math.max(0, Math.ceil((T.end - Date.now()) / 1000));
  $("tT").textContent = fmtT(left); $("tLbl").textContent = "Descanso · " + T.ex;
  $("tBar").style.width = (T.total ? Math.min(100, left / T.total * 100) : 0) + "%";
  if (left <= 0){
    clearInterval(T.iv); T.iv = null; $("timer").classList.add("fin"); $("tLbl").textContent = "¡Siguiente serie!";
    beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){}
    setTimeout(() => { if (!T.iv) $("timer").classList.remove("show"); }, 4000);
  }
}
function stopRest(){ clearInterval(T.iv); T.iv = null; $("timer").classList.remove("show"); }

  const ejercicios = []; let series = 0, vol = 0, subidas = 0;
  r.ejercicios.forEach(ej => {
    const sets = (session.sets[ej.id] || []).filter(s => s.hecho).map(s => ({kg: num(s.kg), reps: num(s.reps)}));
    if (!sets.length) return;
    ejercicios.push({nombre: ej.nombre, equipo: ej.equipo, sets}); series += sets.length;
    sets.forEach(s => vol += s.kg * s.reps);
    const mx = Math.max(...sets.map(s => s.kg));
    if (mx && mx !== num(ej.kg)){ if (mx > num(ej.kg)) subidas++; ej.kg = mx; }
  });
  if (!series && !session.rondas.some(Boolean)){ toast("Marca al menos una serie con ✓ antes de guardar"); return; }
  const entry = {id: nid(), fecha: new Date().toISOString(), rutinaId: r.id, rutinaNombre: r.nombre,
    duracionMin: Math.max(1, Math.round((Date.now() - session.inicio) / 60000)), rondasCalentamiento: session.rondas.filter(Boolean).length,
    series, volumen: Math.round(vol), ejercicios};
  state.historial.unshift(entry); state.historial = state.historial.slice(0, 400);
  session = null; saveSession(); persist(); stopRest();
  view = "rutinas"; render(); window.scrollTo(0, 0);
  openModal(`<div class="big" style="font-size:32px">¡Entreno guardado!</div><div class="sub">${esc(entry.rutinaNombre)}</div>
    <div class="tiles" style="margin:16px 0"><div class="tile"><b>${entry.duracionMin}</b><span>minutos</span></div><div class="tile"><b>${entry.series}</b><span>series</span></div><div class="tile"><b>${fmtKg(entry.volumen)}</b><span>kg movidos</span></div></div>
    <p class="sub">${subidas ? `Has subido peso en ${subidas} ejercicio${subidas > 1 ? "s" : ""}: la rutina ya tiene los kilos nuevos. ` : ""}Llevas ${weekCount()} de ${state.objetivoSemanal || 4} entrenos esta semana.</p>
    <div class="actions"><button class="btn" data-act="close">Cerrar</button></div>`);
}
function csv(){
  const S = sheetsData();
  return Object.entries(S).filter(([, r]) => r.length > 1).map(([n, rows]) => n + "\n" + rows.map(r => r.map(c => { c = typeof c === "number" ? String(c).replace(".", ",") : String(c == null ? "" : c); return /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(";")).join("\n")).join("\n\n");
}

document.addEventListener("pointerdown", () => { try { if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.state === "suspended") actx.resume(); } catch(e){} }, {passive: true});

document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab){ armed = null; const t = tab.dataset.tab; view = t; location.hash = t; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, was = armed; armed = null;
  const r = getR(sel);
  switch (a){
    case "open": sel = b.dataset.id; view = "rutina"; render(); window.scrollTo(0, 0); return;
    case "home": view = "rutinas"; render(); return;
    case "edit": view = "editar"; render(); window.scrollTo(0, 0); return;
    case "start": startSession(r); return;
    case "resume": sel = session.rutinaId; view = "entreno"; render(); window.scrollTo(0, 0); return;
    case "round": session.rondas[+b.dataset.i] = !session.rondas[+b.dataset.i]; saveSession(); render(); return;
    case "check": {
      const ej = getR(session.rutinaId).ejercicios.find(x => x.id === b.dataset.ej), s = session.sets[ej.id][+b.dataset.i];
      s.hecho = !s.hecho; if (s.hecho) startRest(num(ej.descanso), ej.nombre);
      saveSession(); render(); return; }
    case "addset": { const arr = session.sets[b.dataset.ej], p = arr[arr.length - 1] || {kg: "", reps: ""}; arr.push({kg: p.kg, reps: p.reps, hecho: false}); saveSession(); render(); return; }
    case "finish": finish(); return;
    case "exit":
      openModal(`<div class="big" style="font-size:30px">¿Salir del entreno?</div><p class="sub">Llevas ${doneSets()} series hechas.</p>
        <div class="actions" style="flex-direction:column">
          <button class="btn" data-act="close">Seguir entrenando</button>
          <button class="btn ghost" data-act="pause">Salir y continuar luego</button>
          <button class="btn ghost" data-act="finish-modal">Terminar y guardar</button>
          <button class="btn danger" data-act="cancel-w">Anular entreno (no se guarda nada)</button></div>`); return;
    case "pause": closeModal(); stopRest(); view = "rutinas"; render(); window.scrollTo(0, 0); toast("Entreno en pausa: lo retomas desde Rutinas"); return;
    case "finish-modal": closeModal(); finish(); return;
    case "cancel-w": closeModal(); session = null; saveSession(); stopRest(); view = "rutinas"; render(); window.scrollTo(0, 0); toast("Entreno anulado"); return;
    case "discard":
      if (was !== "discard"){ armed = "discard"; render(); return; }
      session = null; saveSession(); stopRest(); view = "rutinas"; render(); toast("Entreno descartado"); return;
    case "close": closeModal(); return;
    case "t-plus": T.end += 15000; T.total += 15; if (!T.iv){ T.iv = setInterval(tick, 250); $("timer").classList.remove("fin"); } tick(); return;
    case "t-minus": T.end -= 15000; tick(); return;
    case "t-skip": stopRest(); return;
    case "csv": try { await navigator.clipboard.writeText(csv()); toast("Copiado: pégalo en Excel o Google Sheets"); } catch(err){ toast("No se pudo copiar en este navegador"); } return;
    case "delsess":
      if (was !== b.dataset.id){ armed = b.dataset.id; render(); return; }
      state.historial = state.historial.filter(x => x.id !== b.dataset.id); scheduleSave(); render(); return;
    case "info": {
      const l = libFor(b.dataset.n); if (!l) return;
      openModal(`<div class="sub">${esc(l.grupo)} · ${esc(l.equipo)}</div><div class="big" style="font-size:30px">${esc(l.nombre)}</div>
        ${l.pic ? picSVG(l.pic, "bigpic") + `<p class="sub" style="text-align:center;margin-top:0">La flecha naranja marca hacia dónde mueves el peso.</p>` : ""}
        ${norm(l.en) !== norm(l.nombre) ? `<div class="sub">En la app del gym: ${esc(l.en)}</div>` : ""}
        <p style="font-size:17px;line-height:1.5">${esc(l.tip)}</p><div class="actions"><button class="btn" data-act="close">Entendido</button></div>`); return; }
    case "libg": libG = b.dataset.g; document.querySelectorAll(".chips .chip").forEach(c => c.classList.toggle("on", c.dataset.g === libG)); fillLib(); return;
    case "libadd": {
      const l = LIB.find(x => x.id === b.dataset.l);
      if (!state.rutinas.length){ toast("Primero crea una rutina"); return; }
      openModal(`<b style="font-size:19px">Añadir «${esc(l.nombre)}» a…</b><div style="margin-top:12px">` +
        state.rutinas.map(rr => `<button class="rcard" data-act="libto" data-l="${l.id}" data-id="${rr.id}"><div><b>${esc(rr.nombre)}</b><span class="sub">${rr.ejercicios.length} ejercicios</span></div>${I.chev}</button>`).join("") +
        `</div><div class="actions"><button class="btn ghost" data-act="close">Cancelar</button></div>`); return; }
    case "libto": { const l = LIB.find(x => x.id === b.dataset.l), rr = getR(b.dataset.id); rr.ejercicios.push(fromLib(l, "e")); scheduleSave(); closeModal(); toast("Añadido a " + rr.nombre + ". Ajusta los kilos en Editar."); return; }
    case "pick": openPicker(b.dataset.k); return;
    case "pickg": pick.g = b.dataset.g; fillPick(); return;
    case "pickadd": { const l = LIB.find(x => x.id === b.dataset.l); (pick.k === "w" ? r.calentamiento : r.ejercicios).push(fromLib(l, pick.k)); scheduleSave(); closeModal(); render(); toast("Añadido: " + l.nombre); return; }
    case "addday": {
      const nr = {id: nid(), nombre: "Nueva rutina", rondas: 2, calentamiento: [], ejercicios: []};
      state.rutinas.push(nr); scheduleSave(); sel = nr.id; view = "editar"; render(); window.scrollTo(0, 0); return; }
    case "addw": r.calentamiento.push(W("Nuevo ejercicio", "Peso corporal", "10", "reps")); scheduleSave(); render(); return;
    case "adde": r.ejercicios.push(E("Nuevo ejercicio", "Máquina", 3, "12", 0, 60)); scheduleSave(); render(); return;
    case "del": {
      if (was !== b.dataset.e){ armed = b.dataset.e; render(); return; }
      const k = b.dataset.k === "w" ? "calentamiento" : "ejercicios";
      r[k] = r[k].filter(x => x.id !== b.dataset.e); scheduleSave(); render(); return; }
    case "delday":
      if (was !== "delday"){ armed = "delday"; render(); return; }
      state.rutinas = state.rutinas.filter(x => x.id !== r.id);
      if (session && session.rutinaId === r.id){ session = null; saveSession(); }
      scheduleSave(); view = "rutinas"; render(); return;
    case "body-add": {
      const entry = {id: nid(), fecha: $("cf").value || today()}; let any = false;
      MET.filter(m => m.g !== "calc").forEach(m => { const x = num($("b-" + m.k).value); if (x){ entry[m.k] = x; any = true; } });
      if (!any){ toast("Escribe al menos un dato"); return; }
      state.cuerpo.push(entry); state.cuerpo = state.cuerpo.slice(-500); scheduleSave(); render(); toast("Registro guardado"); return; }
    case "bm": bodyM = b.dataset.k; render(); return;
    case "calm": { const [y, m] = calMonth.split("-").map(Number), d = new Date(y, m - 1 + (+b.dataset.d), 1); const nm = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); if (nm <= today().slice(0, 7)){ calMonth = nm; render(); } return; }
    case "dayopen": openDay(b.dataset.d); return;
    case "dayfood": comDate = b.dataset.d; comTab = "diario"; closeModal(); view = "comida"; location.hash = "comida"; render(); window.scrollTo(0, 0); return;
    case "xlsx": exportXlsx(); return;
    case "backup": saveFile("MiGym_copia_" + today() + ".json", JSON.stringify(state, null, 1)); return;
    case "restore-ok": if (window.__restore){ state = normalize(window.__restore); window.__restore = null; session = null; saveSession(); persist(); closeModal(); view = "rutinas"; render(); toast("Copia restaurada"); } return;
    case "ctab": comTab = b.dataset.k; closeModal(); render(); window.scrollTo(0, 0); return;
    case "cday": { const nd = addDays(comDate, +b.dataset.d); if (nd <= today()){ comDate = nd; render(); } return; }
    case "fadd": openFoodPicker(b.dataset.m); return;
    case "fpick": {
      const f = FOOD[b.dataset.id], q = num($("fqty").value) || 1, log = dayLog(comDate, true);
      (log[mealPick.meal] = log[mealPick.meal] || []).push(mkItem(f, q)); pruneFood(); scheduleSave(); render(); fillFoods(); toast("Añadido: " + f.n); return; }
    case "fcustom": {
      const n = $("pn").value.trim(); if (!n){ toast("Escribe el nombre"); return; }
      const log = dayLog(comDate, true);
      (log[mealPick.meal] = log[mealPick.meal] || []).push({id: nid(), n, por: "personalizado", kcal: Math.round(num($("pk").value)), p: num($("pp").value), c: num($("pc").value), g: num($("pg").value)});
      pruneFood(); scheduleSave(); closeModal(); render(); return; }
    case "fdel": {
      if (was !== b.dataset.id){ armed = b.dataset.id; render(); return; }
      const log = dayLog(comDate); log[b.dataset.m] = (log[b.dataset.m] || []).filter(x => x.id !== b.dataset.id); scheduleSave(); render(); return; }
    case "ccopy": {
      const y = state.comidas[addDays(comDate, -1)]; if (!y || !Object.values(y).some(a => a.length)){ toast("Ayer no hay comidas apuntadas"); return; }
      const log = dayLog(comDate, true); MEALS.forEach(([k]) => (y[k] || []).forEach(x => (log[k] = log[k] || []).push(Object.assign({}, x, {id: nid()}))));
      pruneFood(); scheduleSave(); render(); toast("Comidas de ayer copiadas"); return; }
    case "muse": {
      const mn = MENUS[+b.dataset.i]; comDate = today(); const log = dayLog(comDate, true);
      MEALS.forEach(([k]) => (mn.m[k] || []).forEach(([id, q]) => (log[k] = log[k] || []).push(mkItem(FOOD[id], q))));
      pruneFood(); scheduleSave(); comTab = "diario"; render(); window.scrollTo(0, 0); toast("Menú apuntado en hoy. Quita lo que no comas."); return; }
    case "mbuy": {
      const mn = MENUS[+b.dataset.i], ids = []; MEALS.forEach(([k]) => (mn.m[k] || []).forEach(([id]) => ids.push(id)));
      const n = addToList(ids); scheduleSave(); toast(n ? n + " productos añadidos a la compra" : "Ya los tenías en la lista"); return; }
    case "cstaples": { const n = addToList(STAPLES); scheduleSave(); render(); toast(n + " productos añadidos"); return; }
    case "cadd": { const v = $("cnew").value.trim(); if (!v) return; state.compra.push({id: nid(), n: v, cat: "Otros", hecho: false}); scheduleSave(); render(); setTimeout(() => $("cnew") && $("cnew").focus(), 0); return; }
    case "cclear": if (was !== "cclear"){ armed = "cclear"; render(); return; } state.compra = state.compra.filter(x => !x.hecho); scheduleSave(); render(); return;
    case "ccopylist": try { await navigator.clipboard.writeText("Lista de la compra\n" + state.compra.filter(x => !x.hecho).map(x => "- " + x.n).join("\n")); toast("Lista copiada: pégala en WhatsApp o Notas"); } catch(err){ toast("No se pudo copiar en este navegador"); } return;
    case "body-del":
      if (was !== b.dataset.id){ armed = b.dataset.id; render(); return; }
      state.cuerpo = state.cuerpo.filter(x => x.id !== b.dataset.id); scheduleSave(); render(); return;
    case "start-sample": { const rs = sample(); rs.forEach(x => x.ejercicios.forEach(e => e.kg = 0)); state = blank(rs); persist(); closeModal(); view = "rutinas"; render(); return; }
    case "start-blank": state = blank([]); persist(); closeModal(); view = "rutinas"; render(); return;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "libQ"){ libQ = t.value; fillLib(); return; }
  if (t.id === "pickQ" && pick){ pick.q = t.value; fillPick(); return; }
  if (t.id === "fq" && mealPick){ mealPick.q = t.value; fillFoods(); return; }
  if (!t.dataset.in || !session) return;
  const arr = session.sets[t.dataset.ej]; if (!arr || !arr[+t.dataset.i]) return;
  arr[+t.dataset.i][t.dataset.in] = t.value; saveSession();
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "cdate" && t.value){ comDate = t.value > today() ? today() : t.value; render(); return; }
  if (t.id === "restore" && t.files && t.files[0]){
    t.files[0].text().then(txt => {
      let d; try { d = JSON.parse(txt); } catch(err){ toast("Ese archivo no es una copia de Mi Gym"); return; }
      if (!d || d.version !== 2 || !Array.isArray(d.rutinas)){ toast("Ese archivo no es una copia de Mi Gym"); return; }
      window.__restore = d;
      openModal(`<div class="big" style="font-size:28px">¿Restaurar la copia?</div><p class="sub">Tiene ${d.rutinas.length} rutinas, ${(d.historial || []).length} entrenos, ${Object.keys(d.comidas || {}).length} días de comidas y ${(d.cuerpo || []).length} registros de cuerpo. Sustituirá todo lo que tienes ahora.</p>
        <div class="actions"><button class="btn danger" data-act="restore-ok">Sí, restaurar</button><button class="btn ghost" data-act="close">Cancelar</button></div>`);
    }); return; }
  if (t.dataset.ci){ const it = state.compra.find(x => x.id === t.dataset.ci); if (it){ it.hecho = t.checked; t.closest(".ci").classList.toggle("got", t.checked); scheduleSave(); } return; }
  const f = t.dataset.f; if (!f) return;
  if (f === "nutri"){ state.nutri[t.dataset.k] = t.value; scheduleSave(); render(); return; }
  if (f === "altura"){ state.altura = Math.min(230, Math.max(0, parseInt(t.value) || 0)); scheduleSave(); render(); return; }
  if (f === "goal"){ state.objetivoSemanal = Math.min(7, Math.max(1, parseInt(t.value) || 4)); scheduleSave(); render(); return; }
  const r = getR(sel); if (!r) return;
  if (f === "rnombre"){ r.nombre = t.value.trim() || r.nombre; scheduleSave(); return; }
  if (f === "rondas"){ r.rondas = Math.min(6, Math.max(1, parseInt(t.value) || 1)); scheduleSave(); return; }
  const list = t.dataset.k === "w" ? r.calentamiento : r.ejercicios;
  const it = list.find(x => x.id === t.dataset.e); if (!it) return;
  if (f === "series") it.series = Math.min(10, Math.max(1, parseInt(t.value) || 1));
  else if (f === "descanso") it.descanso = Math.max(0, parseInt(t.value) || 0);
  else if (f === "kg") it.kg = num(t.value);
  else if (f === "nombre") it.nombre = t.value.trim() || it.nombre;
  else it[f] = t.value.trim();
  scheduleSave();
});

document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "cnew"){ e.preventDefault(); const b = document.querySelector('[data-act="cadd"]'); if (b) b.click(); } });
$("modal").addEventListener("click", e => { if (e.target.id === "modal" && !$("modalBox").querySelector('[data-act="start-sample"]')) closeModal(); });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (TABS.includes(v) && v !== view && !(v === "rutinas" && ["rutina","entreno","editar"].includes(view))){ view = v; render(); } });

render();
if (!stored) welcome();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
